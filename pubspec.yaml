name: vaultkey
description: Vaultly — an offline, encrypted password manager with vault health insights and scheduled backups.
version: 1.8.0+11
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  package_info_plus: ^8.0.0

  # Navigation
  go_router: ^14.2.0

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3
  intl: ^0.19.0
  path_provider: ^2.1.3

  # Biometric unlock
  local_auth: ^2.3.0

  # Direct platform dep — di.dart constructs FlutterSecureStorage
  flutter_secure_storage: ^9.2.2

  # Export / import
  share_plus: ^10.0.0
  file_picker: ^10.1.9
  url_launcher: ^6.3.0

  # Import from other apps: 1Password .1pux archives and authenticator QR
  archive: ^4.5.2
  mobile_scanner: ^7.4.2

  # Device-to-device sync: pairing QR, X25519/HKDF/ChaCha20-Poly1305, mDNS
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  nsd: ^5.0.1

  # Android SAF folder access for scheduled auto-backups
  saf_util: ^0.9.0
  saf_stream: ^0.10.0

  # Core packages
  core_crypto:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_crypto
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_storage:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_storage
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_security:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_security
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_theme:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_theme
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_ui:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_ui
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_lock:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_lock
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_backup:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_backup
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_notify:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_notify
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_update:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_update
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1
  # Mocks the appearance preference in widget tests
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#7341E6"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F6F7F9"
  color_dark: "#0A0C10"
  image: assets/brand/splash-tile.png
  branding: assets/brand/offlyne-endorsement.png
  branding_dark: assets/brand/offlyne-endorsement-white.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#7341E6"
    icon_background_color_dark: "#7341E6"
    color: "#F6F7F9"
    color_dark: "#0A0C10"
    branding: assets/brand/offlyne-endorsement.png
    branding_dark: assets/brand/offlyne-endorsement-white.png

flutter:
  uses-material-design: true
